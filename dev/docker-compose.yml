services:
  dev:
    build: .
    environment:
      HOST_GID: $GID
      HOST_UID: $UID
      http_proxy: http://egress:8888
      https_proxy: http://egress:8888
    hostname: dev
    networks: [walled]
    dns: ["0.0.0.0"]
    volumes:
      - ./home:/home/user
      - ../src:/home/user/src
    depends_on: [egress]
  egress:
    build: ./egress
    hostname: egress
    networks:
      walled:
        driver_opts:
          com.docker.network.endpoint.ifname: walled0
      outside: {}
networks:
  walled:
    internal: true
  outside: {}
