services:
  dev:
    build: .
    command: ["sleep", "infinity"]
    environment:
      HOST_GID: $GID
      HOST_UID: $UID
      http_proxy: http://egress:8888
      https_proxy: http://egress:8888
    init: true
    restart: always
    hostname: dev
    networks:
      walled:
        driver_opts:
          com.docker.network.endpoint.ifname: walled0
    dns: ["0.0.0.0"]
    volumes:
      - ./home:/home/user
      - ../src:/home/user/src
    depends_on: [egress]
  egress:
    build: ./egress
    restart: always
    hostname: egress
    networks:
      walled:
        driver_opts:
          com.docker.network.endpoint.ifname: walled0
      outside: {}
  tunnel:
    build: ./tunnel
    environment:
      HOST_GID: $GID
      HOST_UID: $UID
      SSH_AUTH_SOCK: /ssh-agent.sock
    init: true
    networks: [outside]
    # The agent's tunnel container starts it.
    profiles: [tunnel]
    volumes:
      - $HOME/.ssh:/home/user/.ssh:ro
      - ./home/.ssh:/sockets
      - ./tunnels.yml:/tunnels.yml:ro
      - type: bind
        source: ${SSH_AUTH_SOCK:-/dev/null}
        target: /ssh-agent.sock
        bind:
          # Fail on a stale socket instead of creating a root-owned directory: https://github.com/compose-spec/compose-spec/blob/6b3a2a93e77c30ded1aa8264307e74d1208a6eae/spec.md?plain=1#L2399
          create_host_path: false
networks:
  walled:
    internal: true
  outside: {}
