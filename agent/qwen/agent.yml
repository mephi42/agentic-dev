services:
  agent:
    build:
      context: ./claude   # qwen runs the claude binary
      args:
        REVIEW_PROMPTS_PROJECT: $REVIEW_PROMPTS_PROJECT
    environment:
      # Qwen runs through Claude Code via llama-server's Anthropic-compatible endpoint.
      ANTHROPIC_BASE_URL: http://llm:8080
      ANTHROPIC_AUTH_TOKEN: local
      API_TIMEOUT_MS: "3000000"
      no_proxy: llm
    volumes:
      - $PROJECT_DIR/AGENTS.md:/home/user/AGENTS.md
    depends_on:
      llm:
        condition: service_healthy
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server-rocm
    # The walled network has no route to Hugging Face: download the model
    # into ~/.cache/llama.cpp beforehand.
    command:
      - --hf-repo
      - Qwen/Qwen3-14B-GGUF:Q4_K_M
      - --offline
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    devices:
      - /dev/dri
      - /dev/kfd
    environment:
      LLAMA_CACHE: /models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 2s
      retries: 300
    hostname: llm
    networks: [walled]
    volumes:
      - $HOME/.cache/llama.cpp:/models
  egress:
    build:
      additional_contexts:
        agent: $AGENT_DIR
