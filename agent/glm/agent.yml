services:
  agent:
    build:
      context: ./claude   # glm runs the claude binary
      args:
        REVIEW_PROMPTS_PROJECT: $REVIEW_PROMPTS_PROJECT
    environment:
      # GLM 5.3 runs through Claude Code via Z.ai's Anthropic-compatible endpoint.
      ANTHROPIC_BASE_URL: https://api.z.ai/api/anthropic
      ANTHROPIC_AUTH_TOKEN: $ZAI_API_KEY
      ANTHROPIC_DEFAULT_OPUS_MODEL: glm-5.3
      ANTHROPIC_DEFAULT_SONNET_MODEL: glm-5.3
      ANTHROPIC_DEFAULT_HAIKU_MODEL: glm-4.5-air
      API_TIMEOUT_MS: "3000000"
    volumes:
      - $PROJECT_DIR/AGENTS.md:/home/user/AGENTS.md
  egress:
    build:
      additional_contexts:
        agent: $AGENT_DIR
