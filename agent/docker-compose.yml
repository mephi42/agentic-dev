services:
  common:
    build: ./common
  agent:
    build:
      additional_contexts:
        base: "service:common"
    environment:
      HOST_GID: $GID
      HOST_UID: $UID
      http_proxy: http://egress:8888
      https_proxy: http://egress:8888
      REVIEW_PROMPTS_PROJECT: $REVIEW_PROMPTS_PROJECT
    hostname: agent
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    # docker-entrypoint.sh: shadow-utils fchown /etc/shadow, setpriv switches user.
    # docker-init: runs as root, forwards signals to the non-root child.
    cap_add: [CHOWN, KILL, SETGID, SETUID]
    labels:
      io.github.mephi42.agentic-dev.project-dir: $PROJECT_DIR
    networks: [walled]
    dns: ["0.0.0.0"]
    volumes:
      - ./home:/home/user
      # init writes here, so keep it out of the agent's reach.
      - ./home/.ssh:/home/user/.ssh:ro
      - $PROJECT_DIR/src:/home/user/src
      - $PROJECT_DIR/.gitmodules:/home/user/.gitmodules
    working_dir: /home/user/$WORKING_DIR
    depends_on: [egress, tunnel]
  egress:
    build:
      context: ./egress
      additional_contexts:
        dev-egress: $PROJECT_DIR/dev/egress
    hostname: egress
    networks:
      walled:
        driver_opts:
          com.docker.network.endpoint.ifname: walled0
      outside: {}
  tunnel:
    build: $PROJECT_DIR/dev/tunnel
    environment:
      HOST_GID: $GID
      HOST_UID: $UID
    init: true
    networks: [outside]
    volumes:
      - $HOME/.ssh:/home/user/.ssh:ro
      - ./home/.ssh:/sockets
networks:
  walled:
    internal: true
    # Leaves the bridge without an address the host could serve on: https://github.com/docker/docs/blob/f8d4abc333036d7d71928bab49a417876d348966/content/manuals/engine/network/port-publishing.md?plain=1#L186-L192
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
  outside: {}
