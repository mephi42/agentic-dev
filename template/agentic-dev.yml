project:
  name: <myproject>           # docker-compose project name
  working-dir: src            # cwd for the agent and dev containers
  #agent: claude              # agent to run (default: claude)
  #kvm: true                  # expose /dev/kvm to dev containers
  #base-image: ubuntu:24.04   # base image for the agent and dev images
  #llvm: 22                   # install this LLVM version from apt.llvm.org
  #rust: 1.97.1               # install this Rust version
  #ccache: 100G               # install ccache with this max cache size
  #review-prompts: kernel     # install masoncl/review-prompts for this project
  #packages:                  # extra apt packages for the dev image
  #  - build-essential
  #  - gdb
  #post-install:              # shell commands to run as root in the dev image,
  #  - locale-gen en_US.UTF-8   after the packages are installed
  #post-init:                 # shell commands to run locally after init
  #  - echo 🎉
#localhost:                  # the machine the agent itself runs on
#  packages:                 # extra apt packages for the agent image
#    - gdb
#  allow:                    # extra egress, as tinyproxy filter lines
#    - ^pkg\.go\.dev$
#    - \.amazonaws\.com$
#  mounts:                   # host paths for the agent, read-only unless :rw
#    - ~/.aws:/home/user/.aws
#    - ~/.config/gcloud:/home/user/.config/gcloud:rw
hosts:
  <host ssh alias>:           # you must configure host ssh to understand this
    containers:
      <container ssh alias>:  # will be created automatically for use by agent
        path: <myproject>     # path for container files on the remote host
        #packages:            # extra apt packages, for this container only
        #  - libxen-dev
        #post-install:        # extra post-install commands, this container only
        #  - locale-gen en_US.UTF-8
